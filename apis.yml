aid: potrero-medical
name: Potrero Medical
description: 'Potrero Medical — which completed a restructuring and now operates as Accuryn
  Medical — is a Hayward, California predictive-health medical device company founded in
  2012. Its FDA-cleared Accuryn Monitoring System turns a Foley catheter into a critical-care
  sensor, automatically measuring urine output, intra-abdominal pressure and core body
  temperature so clinicians can detect acute kidney injury, sepsis and abdominal compartment
  syndrome earlier while reducing CAUTI risk. The monitor reaches the EMR through Capsule
  medical device integration rather than a first-party developer API: as of August 2026 the
  company publishes no public API, SDK, developer portal or machine-readable contract of any
  kind, and its only web surface is a WordPress marketing site at accuryn.com.'
